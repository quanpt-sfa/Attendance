name: Attendance Regression Tests

on:
  push:
    branches:
      - main
      - feature/offline-vietnamese-tts
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Python syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile startup.py tts_service.py tts_worker.py server_tts.py tools/tts_phoneme_audit.py
          python -m unittest test_db_schema test_startup -v
          python -m unittest test_tts_service test_tts_worker test_server_tts test_tts_integration -v
          python -m unittest test_tts_audit -v
      - name: JavaScript syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check random-picker.js
          node --check random-picker-attendance.js
          node --check random-picker-speech.js
          node --check tools/nghi_phoneme_audit.mjs
          node --check tts/nghi_frontend.mjs
          node test_nghi_frontend.mjs
          node test_random_picker_attendance.js
          node test_random_picker_speech.js
      - name: Real pinned NGHI frontend parity
        shell: bash
        run: |
          set -euo pipefail
          NGHI_COMMIT="46d160da32041f7e176607203b958069265df7da"
          NGHI_ROOT="$RUNNER_TEMP/nghitts"
          CONFIG_PATH="$RUNNER_TEMP/calmwoman3688.onnx.json"
          OUTPUT_DIR="$RUNNER_TEMP/tts-audit"
          export CONFIG_PATH

          git clone --filter=blob:none --no-checkout https://github.com/nghimestudio/nghitts.git "$NGHI_ROOT"
          git -C "$NGHI_ROOT" fetch --depth=1 origin "$NGHI_COMMIT"
          git -C "$NGHI_ROOT" checkout --detach "$NGHI_COMMIT"
          test "$(git -C "$NGHI_ROOT" rev-parse HEAD)" = "$NGHI_COMMIT"
          (cd "$NGHI_ROOT" && npm ci --omit=dev)

          python - <<'PY'
          import hashlib
          import os
          import urllib.request

          url = (
              "https://huggingface.co/sannht/vi_voice/resolve/"
              "62e57b18157ed213b3863a7a8a35b14d3404554b/"
              "tts-model/calmwoman3688.onnx.json?download=true"
          )
          expected = "971f57f8d504223fee5b40d664f503cf769baf7db21f7d2ae0554a75d07de2f8"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read()
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected, (expected, actual)
          with open(os.environ["CONFIG_PATH"], "wb") as handle:
              handle.write(data)
          PY

          python tools/tts_phoneme_audit.py \
            --node "$(command -v node)" \
            --nghi-root "$NGHI_ROOT" \
            --config "$CONFIG_PATH" \
            --output-dir "$OUTPUT_DIR"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "tts-audit" / "tts_phoneme_audit.json").read_text(encoding="utf-8"))
          assert payload["all_match"] is True
          assert len(payload["cases"]) == 5
          assert len(payload["cases"][1]["production"]["chunks"]) == 2
          PY
