name: Attendance Regression Tests

on:
  push:
    branches:
      - main
      - feature/offline-vietnamese-tts
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile startup.py tts_service.py tts_worker.py server_tts.py tools/tts_phoneme_audit.py
          python -m unittest test_db_schema test_startup -v
          python -m unittest test_tts_service test_tts_worker test_server_tts test_tts_integration -v
          python -m unittest test_tts_audit -v
      - name: Probe model-matched Piper 1.3 Vietnamese frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "piper-tts==1.3.0"
          python - <<'PY'
          import importlib.metadata
          from piper.phonemize_espeak import ESPEAK_DATA_DIR, EspeakPhonemizer

          assert importlib.metadata.version("piper-tts") == "1.3.0"
          phonemizer = EspeakPhonemizer(ESPEAK_DATA_DIR)
          sentences = phonemizer.phonemize(
              "vi",
              "huỳnh quốc phước đã điểm danh thành công. mời sinh viên tiếp theo.",
          )
          rendered = ["".join(sentence) for sentence in sentences]
          print("Piper 1.3 sentence groups:", len(sentences))
          print("Piper 1.3 phonemes:", rendered)
          assert len(sentences) == 2, rendered
          assert any("1" in sentence for sentence in rendered), rendered
          assert any("7" in sentence for sentence in rendered), rendered
          PY
      - name: JavaScript syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check random-picker.js
          node --check random-picker-attendance.js
          node --check random-picker-speech.js
          node --check tools/nghi_phoneme_audit.mjs
          node test_random_picker_attendance.js
          node test_random_picker_speech.js
